plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def signingValue = { name ->
    providers.gradleProperty(name)
            .orElse(providers.environmentVariable(name))
            .orElse(localProperties.getProperty(name) ?: '')
            .orNull
}
def releaseStoreFile = signingValue('MENDROID_STORE_FILE')
def releaseStorePassword = signingValue('MENDROID_STORE_PASSWORD')
def releaseKeyAlias = signingValue('MENDROID_KEY_ALIAS')
def releaseKeyPassword = signingValue('MENDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = 'co.samco.mendroid'
    compileSdk = 37
    defaultConfig {
        applicationId = "co.samco.mendroid"
        minSdk = 31
        targetSdk = 37
        versionCode = 50700
        versionName = "5.7.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Set the .debug applicationIdSuffix
            applicationIdSuffix = ".debug"
            // And give the app name the debug suffix
            versionNameSuffix = "-debug"
            resValue "string", "app_name", "MEND Debug"
            minifyEnabled = false
            shrinkResources = false
        }
        debugMinify {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.debug
        }
        release {
            debuggable = false
            minifyEnabled = false
            shrinkResources = false
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        compose = true
        resValues = true
    }
    lint {
        warningsAsErrors = true
    }
    testOptions {
        // AGP's Compose preview tasks need compiled resources, including app themes.
        unitTests.includeAndroidResources = true
        unitTests.all { jvmArgs '--enable-native-access=ALL-UNNAMED' }
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        // Compose preview task creation requires unit tests for every variant.
        variantBuilder.enableUnitTest = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        allWarningsAsErrors = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation "androidx.navigation:navigation-compose:2.10.2"

    //Exoplayer
    implementation("androidx.media3:media3-exoplayer:1.11.1")
    implementation 'androidx.media3:media3-ui:1.11.1'

    // -- Hilt --
    ksp "com.google.dagger:hilt-compiler:2.60.1"
    def lifecycle_version = "2.11.0"
    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    // ViewModel utilities for Compose
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"
    implementation "com.google.dagger:hilt-android:2.60.1"
    implementation 'androidx.hilt:hilt-lifecycle-viewmodel-compose:1.4.0'

    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'

    //Core
    implementation project(':core-mend')

    //LightCompressor
    implementation 'com.github.AbedElazizShe:LightCompressor:1.3.3'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.1'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:5.5.1'
}
